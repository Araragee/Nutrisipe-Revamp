name: Keep Render backend alive

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 min — Render spins down after 15
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -fsS --max-time 10 https://nutrisipe-backend.onrender.com/health || true
